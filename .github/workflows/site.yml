name: Site

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the toolkit from the checkout
        run: python -m pip install .
      - name: Assemble the application
        env:
          # the published site of this repository; a first publication finds none
          PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m gen3tl web assemble --registry .github/site-registry.json --out site --public-base https://haritos90.github.io/gen3tl --previous "$PREVIOUS"
      - name: Check the application for excluded files
        run: python .github/scripts/site-check.py site
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: assemble
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy the site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
