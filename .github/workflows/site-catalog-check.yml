name: Site catalog check

on:
  pull_request:
    paths:
      - 'web/i18n/**'
      - 'web/**/*.html'
      - 'web/js/**'
      - 'src/gen3tl/web/sitecatalog.py'
      - 'src/gen3tl/web/siteshell.py'
      - 'src/gen3tl/cli/**'
      - '.github/workflows/site-catalog-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the toolkit without a ROM
        run: python -m pip install .
      - name: Check the site catalogs against the pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from gen3tl.web import sitecatalog

          web = Path("web")
          keys, compared = sitecatalog.compare(web / "i18n", web)
          for catalog in compared:
              print(f"translated  {catalog.path.stem}  {catalog.translated} entries")
          problems = [problem for catalog in compared for problem in catalog.problems]
          if problems:
              for problem in problems:
                  print(problem)
              raise SystemExit(1)
          print(f"site catalogs  {len(compared)} catalogs, {len(keys)} keys, "
                f"translated {sum(catalog.translated for catalog in compared)} entries, holes kept")
          PY
      - name: Check shared page markup
        run: python -m gen3tl web site-shell --web web
